<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Intrusion Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-page Background */
        body {
            background: url('./static/form.jpg') center/cover no-repeat fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Dark Overlay for better readability */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        /* Form Styling */
        .form-container {
            padding: 40px;
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.1); /* Semi-transparent background */
            backdrop-filter: blur(10px);
            border-radius: 10px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .form-label {
            color: white;
            font-weight: bold;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.8);
            border: none;
        }

        /* Buttons Styling */
        .btn-custom {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-secondary {
            background-color: #6c757d;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #545b62;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Network Intrusion Detection</h2>
    <p>Enter Feature values below to predict whether the network traffic is Normal or an Anomaly</p>
    
    <form action="/result" method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">src_bytes</label>
                <input type="text" class="form-control" name="src_bytes" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">dst_bytes</label>
                <input type="text" class="form-control" name="dst_bytes" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">count</label>
                <input type="number" class="form-control" name="count" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">srv_count</label>
                <input type="text" class="form-control" name="srv_count" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">dst_host_count</label>
                <input type="text" class="form-control" name="dst_host_count" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">protocol_type</label>
                <select class="form-select" name="protocol_type" required>
                    <option value="">Choose...</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Service</label>
                <input type="number" class="form-control" name="service" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">flag</label>
                <input type="number" class="form-control" name="flag" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">same_srv_rate</label>
                <input type="text" class="form-control" step="any" name="same_srv_rate" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">diff_srv_rate</label>
                <input type="text" class="form-control" step="any" name="diff_srv_rate" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">dst_host_same_srv_rate</label>
                <input type="text" class="form-control" step="any" name="dst_host_same_srv_rate" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">dst_host_diff_srv_rate</label>
                <input type="text" class="form-control" step="any" name="dst_host_diff_srv_rate" required>
            </div>

            <!-- Buttons -->
            <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-primary btn-custom">Predict</button>
                <a href="/" class="btn btn-secondary">Go to Home</a>

            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
