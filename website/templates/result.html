<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full Page Background */
        html, body {
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('./static/result.jpg') no-repeat center center/cover; /* Add your image path */
        }

        /* Result Container */
        .result-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        /* Result Heading */
        .result-container h2 {
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Result Message */
        .result-message {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            border-radius: 5px;
            display: inline-block;
        }

        /* Normal & Anomaly Colors */
        .normal {
            background-color: #28a745;
            color: white;
        }

        .anomaly {
            background-color: #dc3545;
            color: white;
        }

        /* Button Styling */
        .btn-primary {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 18px;
            width: 100%;
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="result-container">
    <h2>Prediction Result</h2>
    <p>The network traffic analysis indicates:</p>

    <!-- Displaying result received from Flask -->
    <div class="result-message {% if result == 'Anomaly' %}anomaly{% else %}normal{% endif %}">
        {% if result == 'Anomaly' %}
            🚨 Anomaly Detected!
        {% else %}
            ✅ Normal Traffic
        {% endif %}
    </div>

    <!-- Back to Form Button -->
    <a href="/form" class="btn btn-primary">Try Another Prediction</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
